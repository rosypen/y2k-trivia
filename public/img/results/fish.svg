<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 110">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="0.45" stop-color="#ff8a1f"/>
      <stop offset="1" stop-color="#d94a00"/>
    </linearGradient>
    <linearGradient id="fin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb347" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ff6a00" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- tail -->
  <path d="M38 55 C 18 30, 4 22, 2 18 C 10 40, 10 70, 2 92 C 6 88, 20 80, 38 55 Z" fill="url(#fin)" stroke="#c24400" stroke-width="2"/>
  <!-- dorsal fin -->
  <path d="M70 26 C 86 6, 112 6, 124 24 Z" fill="url(#fin)" stroke="#c24400" stroke-width="2"/>
  <!-- body -->
  <ellipse cx="96" cy="56" rx="62" ry="34" fill="url(#body)" stroke="#c24400" stroke-width="2.5"/>
  <!-- belly fin -->
  <path d="M86 86 C 92 100, 108 104, 114 96 Z" fill="url(#fin)" stroke="#c24400" stroke-width="2"/>
  <!-- scales hint -->
  <path d="M80 44 q8 10 0 20 M96 40 q9 12 0 26 M112 42 q8 11 0 22" stroke="#ffe0a8" stroke-width="2" fill="none" opacity="0.6"/>
  <!-- gloss -->
  <ellipse cx="104" cy="36" rx="44" ry="11" fill="url(#gloss)" opacity="0.85"/>
  <!-- eye -->
  <circle cx="134" cy="50" r="10" fill="#fff" stroke="#c24400" stroke-width="2"/>
  <circle cx="137" cy="51" r="5.5" fill="#1a1a2e"/>
  <circle cx="139" cy="48" r="2" fill="#fff"/>
  <!-- smile -->
  <path d="M146 64 q6 4 10 -2" stroke="#8a2e00" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- blush -->
  <ellipse cx="128" cy="66" rx="6" ry="3.5" fill="#ff5f8a" opacity="0.45"/>
</svg>
